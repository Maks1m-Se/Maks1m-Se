name: Upload test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc2=s=320x120:d=3 -f lavfi -i sine=frequency=440:duration=3 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test.mp4
      - name: Try upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_ID=$(gh api repos/${{ github.repository }} --jq .id)
          curl -s -X POST "https://uploads.github.com/user-attachments/assets?name=test.mp4&content_type=video/mp4&repository_id=$REPO_ID" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: video/mp4" --data-binary @test.mp4
