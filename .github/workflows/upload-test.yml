name: Upload test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Make test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc2=s=320x120:d=3 -f lavfi -i sine=frequency=440:duration=3 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test.mp4
      - name: Try upload
        env:
          PAT: ${{ secrets.BLUES_PAT }}
        run: |
          echo "--- Token check ---"
          curl -s -o /dev/null -D - -H "Authorization: Bearer $PAT" https://api.github.com/user | grep -i -E '^(HTTP|x-oauth-scopes)'
          echo "--- Upload ---"
          curl -s -w "\nHTTP %{http_code}\n" -X POST \
            "https://uploads.github.com/user-attachments/assets?name=test.mp4&content_type=video/mp4&repository_id=${{ github.repository_id }}" \
            -H "Authorization: Bearer $PAT" -H "Accept: application/json" -H "Content-Type: video/mp4" \
            --data-binary @test.mp4
